[package]
name = "sunchang-hansang"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "순창한상 로컬 레시피 관리자"
build = "build.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
fs2 = "0.4"
futures-util = "0.3"
mime_guess = "2"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
rust-embed = { version = "8", features = ["debug-embed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal", "test-util"] }
uuid = { version = "1", features = ["v4", "serde"] }
webbrowser = "1"

[build-dependencies]
sha2 = "0.10"
serde_json = "1"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.29"

[profile.release]
lto = "thin"
strip = true
